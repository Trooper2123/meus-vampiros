name: SPEC-SESSION-011 validation

on:
  pull_request:
    branches: [develop]
    paths:
      - 'lib/projects-*'
      - 'lib/coterie-service.ts'
      - 'lib/session11-common.ts'
      - 'lib/vtm-v5/projects.ts'
      - 'lib/db.ts'
      - 'app/api/campaigns/**/projects/**'
      - 'app/api/campaigns/**/coteries/**'
      - 'tests/project-mechanics.test.ts'
      - 'tests/session11-projects-coterie.test.ts'
      - '.github/workflows/spec-session-011-ci.yml'

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, regras e PostgreSQL isolado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: vampiros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vampiros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:isolated-test-only@localhost:5432/vampiros_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências travadas
        run: npm ci
      - name: Verificar tipos
        run: npx tsc --noEmit --incremental false
      - name: Lint dos módulos de sessão 011
        run: npx eslint lib/projects-coterie-schema.ts lib/projects-service.ts lib/coterie-service.ts lib/session11-common.ts lib/vtm-v5/projects.ts app/api/campaigns/'[id]'/projects/route.ts app/api/campaigns/'[id]'/coteries/route.ts tests/project-mechanics.test.ts tests/session11-projects-coterie.test.ts
      - name: Testar mecânicas e isolamento PostgreSQL
        run: npx vitest run tests/project-mechanics.test.ts tests/session11-projects-coterie.test.ts
