<script>

:"https://vtm.paradoxwikis.com/Animalism","wikiChecked":false},{"id":"ANIMALISM:poder:2:20-vtm-v5-vampire-the-masquerade-pdf:245:feral-whispers","discipline":"ANIMALISM","level":2,"type":"Poder","name":"Feral Whispers","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"245","bookPdfPage":247,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"The vampire can commune with the beasts of the wild and the city. Feral Whispers allows two-way communication with animals. A cat might not be interested in debating Matisse's use of color but happily discusses the lack of prey around the brownstone building across the street. Depending on the","cost":"One Rouse Check per animal type per scene; free on the famulus.","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"One scene","pool":"Manipulation + Animalism, Charisma + Animalism","opposing":"Not stated in a separate field","notes":"Communication needs no roll. Persuasion and summoning use different pools. The famulus costs no Rouse Check.","wikiUrl":"https://vtm.paradoxwikis.com/Animalism","wikiChecked":false},{"id":"ANIMALISM:poder:2:04-vtm-vampire-players-guide-pdf:25:hunt-the-beast","discipline":"ANIMALISM","level":2,"type":"Poder","name":"Hunt the Beast","present":"Livros","bookSource":"V5 Player’s Guide — Bully (2021)","bookPage":"25","bookPdfPage":26,"bookFile":"04-VtM-vampire-players-guide.pdf","effect":"Tracks the scent of a supernatural Beast.","cost":"One Rouse Check","prerequisite":"Sense the Beast","amalgam":"Not stated in a separate field","duration":"One hour per margin of success vs a Difficulty determined by the Storyteller","pool":"Resolve + Animalism","opposing":"Composure + Subterfuge or Resolve + Animalism vs Difficulty determined by the Storyteller","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions. Optional or version-specific material; do not enable as an unqualified core rule.","wikiUrl":"https://vtm.paradoxwikis.com/Animalism","wikiChecked":false},{"id":"ANIMALISM:poder:2:12-vtm-v5-live-from-the-succubus-club-document-pdf:27:leash-the-beast","discipline":"ANIMALISM","level":2,"type":"Poder","name":"Leash the Beast","present":"Livros","bookSource":"Live from the Succubus Club","bookPage":"27","bookPdfPage":29,"bookFile":"12-VtM-v5-live-from-the-succubus-club.document.pdf","effect":"Changes specific die results to restrain the Beast or help resist Frenzy.","cost":"One or two Rouse Checks","prerequisite":"Not stated in a separate field","amalgam":"Fortitude 1","duration":"Applied to the altered die result.","pool":"Not stated in a separate field","opposing":"Not stated in a separate field","notes":"Can change a normal 10 to 9, a Hunger 1 to 2, or a failed normal die to a success when resisting Frenzy; costs differ.","wikiUrl":"https://vtm.paradoxwikis.com/Animalism","wikiChecked":false},{"id":"ANIMALISM:poder:2:22-vtm-v5-vampire-the-masquerade-v5-sabbat-the-black-hand-pdf:97:vermin-blood","discipline":"ANIMALISM","level":2,"type":"Poder","name":"Vermin Blood","present":"Livros","bookSource":"Sabbat — Definitive Edition (arquivo alternativo)","bookPage":"97","bookPdfPage":98,"bookFile":"22-VtM-V5-vampire-the-masquerade-v5-sabbat-the-black-hand.pdf","effect":"Transmits diseases awakened in the user's vitae to animals.","cost":"One Rouse Check","prerequisite":"Not stated in a separate field","amalgam":"Blood Sorcery 1","duration":"One Week","pool":"Not stated in a separate field","opposing":"Not stated in a separate field","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions. Optional or version-specific material; do not enable as an unqualified core rule.","wikiUrl":"https://vtm.paradoxwikis.com/Animalism","wikiChecked":false},{"id":"ANIMALISM:poder:2:04-vtm-vampire-players-gui wikis.com/Animalism","wikiChecked":false},{"id":"ANIMALISM:poder:3:20-vtm-v5-vampire-the-masquerade-pdf:246:quell-the-beast","discipline":"ANIMALISM","level":3,"type":"Poder","name":"Quell the Beast","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"246","bookPdfPage":248,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"Quiets the target's Beast, suppressing aggression and impulses.","cost":"One Rouse Check","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"One scene, or a number of turns equal to the test margin plus one.","pool":"Charisma + Animalism","opposing":"Stamina + Resolve","notes":"Targets mortals and vampires differently; check the outcome and duration rules in the source.","wikiUrl":"https://vtm.paradoxwikis.com/Animalism","wikiChecked":false},{"id":"ANIMALISM:poder:3:20-vtm-v5-vampire-the-masquerade-pdf:246:unliving-hive","discipline":"ANIMALISM","level":3,"type":"Poder","name":"Unliving Hive","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"246","bookPdfPage":248,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"Most often seen amongst the Nosferatu, this unnerving power allows the user to extend their animal influence to swarms of insects such as flies or roaches. Certain vampires even go so far as to adopt swarms as famuli, giving them a permanent home within the folds and orifices of their malformed flesh.","cost":"No additional cost","prerequisite":"Not stated in a separate field","amalgam":"Obfuscate 2","duration":"Passive","pool":"Not stated in a separate field","opposing":"Not stated in a separate field","notes":"Extends Animalism to swarms and invertebrate familiars. The Amalgam requirement remains mandatory.","wikiUrl":"https://vtm.paradoxwikis.com/Animalism","wikiChecked":false},{"id":"ANIMALISM:poder:4:04-vtm-vampire-players-guide-pdf:26:pack-frenzy","discipline":"ANIMALISM","level":4,"type":"Poder","name" ":"Poder","name":"Heightened Senses","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"249","bookPdfPage":251,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"The vampire's senses sharpen to a preternatural degree, giving them the ability to see in pitch darkness, hear ultrasonic frequencies and smell the fear of cowering prey.","cost":"Free; see overload conditions.","prerequisite":"None","amalgam":"No","duration":"Until deactivated. Having the power active for longer stretches of time without rest (more than a scene), especially so for high-stimulus environments, might necessitate spending Willpower, at the Storyteller’s discretion.","pool":"Wits + Resolve","opposing":"N/A","notes":"Overwhelming stimuli can require a Wits + Resolve test and may impair the user.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:1:04-vtm-vampire-players-guide-pdf:28:lie-detector","discipline":"AUSPEX","level":1,"type":"Poder","name":"Lie Detector","present":"Livros","bookSource":"V5 Player’s Guide — Bully (2021)","bookPage":"28","bookPdfPage":29,"bookFile":"04-VtM-vampire-players-guide.pdf","effect":"While many vampires are masters of deception, this power gives the user the uncanny ability to know when they are being lied to.","cost":"Free","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"Passive","pool":"Intelligence + Auspex","opposing":"Composure + Subterfuge","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions. Optional or version-specific material; do not enable as an unqualified core rule.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:1:20-vtm-v5-vampire-the-masquerade-pdf:249:sense-the-unseen","discipline":"AUSPEX","level":1,"type":"Poder","name":"Sense the Unseen","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"249","bookPdfPage":251,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"The senses of the vampire become attuned to dimensions beyond the mundane, allowing them to sense presences otherwise hidden from the naked eye. This can be anything from another vampire using Obfuscate to someone using Auspex to spy upon the character to a ghost in the middle of the room. Dormant Blood Sorcery spells and rituals might also be found with this power, at the Storyteller's discretion.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"Wits + Auspex or Resolve + Auspex","opposing":"N/A","notes":"The pool depends on active search or passive detection; resolving supernatural concealment may require a contest.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:2:04-vtm-vampire-players-guide-pdf:28:decipher","discipline":"AUSPEX","level":2,"type":"Poder","name":"Decipher","present":"Livros","bookSource":"V5 Player’s Guide — Bully (2021)","bookPage":"28","bookPdfPage":29,"bookFile":"04-VtM-vampire-players-guide.pdf","effect":"By reading the aura and intent of messages, a vampire can understand any language or code.","cost":"One Rouse Check","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"One scene","pool":"Intelligence + Auspex","opposing":"Not stated in a separate field","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions. Optional or version-specific material; do not enable as an unqualified core rule.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:2:22-vtm-v5-vampire-the-masquerade-v5-sabbat-the-black-hand-pdf:99:dreams-of-the-past","discipline":"AUSPEX","level":2,"type":"Poder","name":"Dreams of the Past","present":"Livros","bookSource":"Sabbat — Definitive Edition (arquivo alternativo)","bookPage":"99","bookPdfPage":100,"bookFile":"22-VtM-V5-vampire-the-masquerade-v5-sabbat-the-black-hand.pdf","effect":"You can restore an item or environment to a previous state of being through illusion and the use of your second sight. A firebombed room, a defaced piece of art, or a book with pages torn out can all be briefly reconstructed with this power.","cost":"One Rouse Check","prerequisite":"Not stated in a separate field","amalgam":"Obfuscate 1","duration":"One scene","pool":"Intelligence + Auspex","opposing":"Not stated in a separate field","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions. Optional or version-specific material; do not enable as an unqualified core rule.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:2:22-vtm-v5-vampire-the-masquerade-v5-sabbat-the-black-hand-pdf:99:elysian-eye","discipline":"AUSPEX","level":2,"type":"Poder","name":"Elysian Eye","present":"Livros","bookSource":"Sabbat — Definitive Edition (arquivo alternativo)","bookPage":"99","bookPdfPage":100,"bookFile":"22-VtM-V5-vampire-the-masquerade-v5-sabbat-the-black-hand.pdf","effect":"Examines dreams and recent memories for signs of manipulation.","cost":"One Rouse Check; also one Willpower against unwilling vampires.","prerequisite":"Unseen Sense (wording in alternative source)","amalgam":"Not stated in a separate field","duration":"One scene","pool":"None or Wits + Auspex","opposing":"Composure + Subterfuge","notes":"The alternative file names its prerequisite “Unseen Sense”; the wording is preserved rather than silently renamed. Optional or version-specific material; do not enable as an unqualified core rule.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:2:04-vtm-vampire-players-guide-pdf:28:implant-dream","discipline":"AUSPEX","level":2,"type":"Poder","name":"Im y or reveal a truth previously overlooked.","cost":"Free or one Rouse Check","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"Passive","pool":"Resolve + Auspex","opposing":"Not stated in a separate field","notes":"The Storyteller can provide passive visions; an intentional attempt has its own cost and test.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:2:04-vtm-vampire-players-guide-pdf:28:read-opponent","discipline":"AUSPEX","level":2,"type":"Poder","name":"Read Opponent","present":"Livros","bookSource":"V5 Player’s Guide — Bully (2021)","bookPage":"28","bookPdfPage":29,"bookFile":"04-VtM-vampire-players-guide.pdf","effect":"Reads intentions and physical cues to anticipate an opponent's attacks.","cost":"One Rouse Check, plus one for each additional target.","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"One scene","pool":"Wits + Auspex or Resolve + Auspex","opposing":"Not stated in a separate field","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions. Optional or version-specific material; do not enable as an unqualified core rule.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:2:04-vtm-vampire-players-guide-pdf:28:sense-strengths-and-weaknesses","discipline":"AUSPEX","level":2,"type":"Poder","name":"Sense Strengths and Weaknesses","present":"Livros","bookSource":"V5 Player’s Guide — Bully (2021)","bookPage":"28","bookPdfPage":29,"bookFile":"04-VtM-vampire-players-guide.pdf","effect":"Sometimes referred to as an appraisal, vibe check, or ocular pat-down, this discipline allows a vampire to read the aura of another and determine the strengths and weaknesses of their physical form, psyche, and personality.","cost":"One Rouse Check","prerequisite":"Not stated in a separate quisite":"Not stated in a separate field","amalgam":"Dominate 2","duration":"Indefinitely","pool":"Manipulation + Auspex","opposing":"Intelligence + Resolve","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions. Optional or version-specific material; do not enable as an unqualified core rule.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:3:04-vtm-vampire-players-guide-pdf:29:psychic-backlash","discipline":"AUSPEX","level":3,"type":"Poder","name":"Psychic Backlash","present":"Livros","bookSource":"V5 Player’s Guide — Bully (2021)","bookPage":"29","bookPdfPage":30,"bookFile":"04-VtM-vampire-players-guide.pdf","effect":"Some kindred are not only incredibly difficult to read, but they can cause a punishing mental backlash to those who attempt to control them.","cost":"One Rouse Check","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"One turn","pool":"Dependent on Supernatural ability defended against","opposing":"Not stated in a separate field","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions. Optional or version-specific material; do not enable as an unqualified core rule.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:3:20-vtm-v5-vampire-the-masquerade-pdf:250:scry-the-soul","discipline":"AUSPEX","level":3,"type":"Poder","name":"Scry the Soul","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"250","bookPdfPage":252,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"By focusing on a person, the vampire can perceive the state of that person's psyche as a shifting aura of colors. Auras reveal little precise information, but do provide clues regarding many subjects, e.g., emotional state, Resonance, and supernatural traits. If looking for a specific condition, the vampire can cursorily scan the crowd to detect it. Such cursory scans provide no further information.","cost":"One Rouse Check","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"One turn, or Storyteller’s discretion","pool":"Intelligence + Auspex","opposing":"Composure + Subterfuge","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:3:20-vtm-v5-vampire-the-masquerade-pdf:250:share-the-senses","discipline":"AUSPEX","level":3,"type":"Poder","name":"Share the Senses","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"250","bookPdfPage":252,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"By reaching out with their mind, the vampire can tap into the senses of another mortal or vampire, seeing, hearing, and feeling what they do. The user still retains their own perceptions and is still aware of their own surroundings, though the effect requires some getting used to. The user decides whether to tap into only one, some, or all of the target's senses. When used on a stranger this power requires line of sight to initiate. However, it can be used over longer distances on someone who still has some of the user's Blood in their body.","cost":"One Rouse Check","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"One scene","pool":"Resolve + Auspex","opposing":"Not stated in a separate field","notes":"Accesses senses rather than bodily control. Check target and awareness conditions.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:4:20-vtm-v5-vampire-the-masquerade-pdf:250:spirit-s-touch","discipline":"AUSPEX","level":4,"type":"Poder","name":"Spirit’s Touch","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"250","bookPdfPage":252,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"By touching an inanimate object or the ground at a location, the vampire can sense the emotional residue left by those who have handled that object or visited the location in the past. The user gains insight into not only that person, but also what was done and under what circumstances. While rarely crystal clear, the information often provides leads impossible to gain from regular forensics and deduction.","cost":"One Rouse Check","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"One turn","pool":"Intelligence + Auspex","opposing":"Not stated in a separate field","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:5:20-vtm-v5-vampire-the-masquerade-pdf:251:clairvoyance","discipline":"AUSPEX","level":5,"type":"Poder","name":"Clairvoyance","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"251","bookPdfPage":253,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"By closing their eyes and entering a light trance, the vampire becomes master of its surroundings. In a few minutes it can gather information from roughly a city-block sized area (more if outdoors or less populated) that would normally take many hours, perhaps days of legwork and investigation. Once connected in such a way to their surroundings the vampire can also receive information on anything happening out of the ordinary in the area.","cost":"One Rouse Check","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"A few minutes for information gathering, up to a night for vigilance.","pool":"Intelligence + Auspex","opposing":"Not stated in a separate field","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:5:20-vtm-v5-vampire-the-masquerade-pdf:251:possession","discipline":"AUSPEX","level":5,"type":"Poder","name":"Possession","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"251","bookPdfPage":253,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"With this power the vampire can strip the will of a mortal and completely possess their body, using it as their own. While the mind of the subject remains hidden to the vampire, they can do anything and go anywhere the subject could while the power remains active. Using this, a vampire can even experience the sunlight, food, and physical sexuality long denied them, their host paying the price for whatever abuse the vampire wreaks on their body while riding it.","cost":"Two Rouse Checks","prerequisite":"Not stated in a separate field","amalgam":"Dominate 3","duration":"Until ended, voluntarily or involuntarily.","pool":"Resolve + Auspex","opposing":"Resolve + Intelligence","notes":"The Dominate Amalgam is an acquisition requirement; possession does not permanently change the target's character type.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:5:20-vtm-v5-vampire-the-masquerade-pdf:252:telepathy","discipline":"AUSPEX","level":5,"type":"Poder","name":"Telepathy","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"252","bookPdfPage":254,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"At the highest levels of Auspex the vampire can now literally read minds, as well as project their own thoughts into the minds of others. While reading a mortal mind is relatively straightforward, undead minds requires a higher effort to penetrate.","cost":"One Rouse Check; also one Willpower against unwilling vampires.","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"Roughly one minute per Rouse Check. Increased to a full scene on consenting subjects.","pool":"Resolve + Auspex","opposing":"Wits + Subterfuge","notes":"An unwilling vampire may also require Willpower expenditure. Consenting targets allow longer contact.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"AUSPEX:poder:5:07-vtm-v5-companion-pdf:24:unburdening-the-bestial-soul","discipline":"AUSPEX","level":5,"type":"Poder","name":"Unburdening the Bestial Soul","present":"Livros","bookSource":"V5 Companion","bookPage":"24","bookPdfPage":24,"bookFile":"07-VtM-V5-Companion.pdf","effect":"Removes or shields against Stains, with consequences for the user.","cost":"Two Rouse Checks; gain one Stain.","prerequisite":"Obeah","amalgam":"Dominate 3","duration":"One session","pool":"Composure + Auspex","opposing":"Humanity","notes":"Requires Obeah and lower target Humanity. The user gains a Stain; the critical Humanity benefit is restricted.","wikiUrl":"https://vtm.paradoxwikis.com/Auspex","wikiChecked":false},{"id":"CELERITY:poder:1:20-vtm-v5-vampire-the-masquerade-pdf:252:cat-s-grace","discipline":"CELERITY","level":1,"type":"Poder","name":"Cat’s Grace","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"252","bookPdfPage":254,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"The vampire gains a balance and grace equal to and surpassing world-class trapeze artists. They can walk and even run across ledges and wires effortlessly and can keep their balance on the slimmest of supports.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposing":"N/A","notes":"Balance is automatic on suitable surfaces; the surface must still be capable of supporting the user.","wikiUrl":"https://vtm.paradoxwikis.com/Celerity","wikiChecked":false},{"id":"CELERITY:poder:1:10-vtm-v5-gehenna-war-pdf:46:fluent-swiftness","discipline":"CELERITY","level":1,"type":"Poder","name":"Fluent Swiftness","present":"Livros","bookSource":"Gehenna War","bookPage":"46","bookPdfPage":48,"bookFile":"10-VtM-V5-gehenna-war.pdf","effect":"The vampire is able to call upon their supernatural speed effortlessly, and rarely tempt their Hunger when doing so.","cost":"None","prerequisite":"None","amalgam":"No","duration":"Once","pool":"N/A","opposing":"N/A","notes":"Only improves the Rouse Check for an eligible Blood Surge on a Dexterity or Celerity test.","wikiUrl":"https://vtm.paradoxwikis.com/Celerity","wikiChecked":false},{"id":"CELERITY:poder:1:20-vtm-v5-vampire-the-masquerade-pdf:253:rapid-reflexes","discipline":"CELERITY","level":1,"type":"Poder","name":"Rapid Reflexes","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"253","bookPdfPage":255,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"While their bodies still can't defy the laws of nature, vampires with this power perceive events instantly and can react to them with superhuman alacrity. They can observe incoming projectiles to the extent that they can attempt to dodge arrows and even bullets without available cover.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","pool":"N/A","opposing":"N/A","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions.","wikiUrl":"https://vtm.paradoxwikis.com/Celerity","wikiChecked":false},{"id":"CELERITY:poder:2:04-vtm-vampire-players-guide-pdf:30:control-momentum","discipline":"CELERITY","level":2,"type":"Poder","name":"Control Momentum","present":"Livros","bookSource":"V5 Player’s Guide — Bully (2021)","bookPage":"30","bookPdfPage":31,"bookFile":"04-VtM-vampire-players-guide.pdf","effect":"After successfully defending themselves i ire using this power risks Stains, as it can completely obliterate the victim's spirit, preventing return as a wraith.","cost":"Two Rouse Checks; a variable number of Stains.","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"One turn","pool":"Resolve + Oblivion","opposing":"Resolve + Occult or Fortitude","notes":"Apply the source-specific targeting, activation and outcome rules. Level, prerequisite powers and Amalgams are cumulative acquisition conditions. Optional or version-specific material; do not enable as an unqualified core rule.","wikiUrl":"https://vtm.paradoxwikis.com/Oblivion","wikiChecked":false},{"id":"POTENCE:poder:1:10-vtm-v5-gehenna-war-pdf:47:fluent-strength","discipline":"POTENCE","level":1,"type":"Poder","name":"Fluent Strength","present":"Livros","bookSource":"Gehenna War","bookPage":"47","bookPdfPage":49,"bookFile":"10-VtM-V5-gehenna-war.pdf","effect":"The vampire is able to call upon their supernatural strength effortlessly, and rarely tempt their Hunger when doing so.","cost":"None","prerequisite":"Not stated in a separate field","amalgam":"Not stated in a separate field","duration":"Not stated in a separate field; consult the system.","pool":"Not stated in a separate field","opposing":"Not stated in a separate field","notes":"Only improves the Rouse Check for an eligible Blood Surge on a Strength or Potence test.","wikiUrl":"https://vtm.paradoxwikis.com/Potence","wikiChecked":false},{"id":"POTENCE:poder:1:20-vtm-v5-vampire-the-masquerade-pdf:264:lethal-body","discipline":"POTENCE","level":1,"type":"Poder","name":"Lethal Body","present":"Livros","bookSource":"Vampire: The Masquerade — Corebook","bookPage":"264","bookPdfPage":266,"bookFile":"20-VtM-V5-Vampire-the-Masquerade.pdf","effect":"Using this power, the user is capable of causing horrendous damage to mortals, tearing skin and breaking bones with bare fingers.","cost":"Free","prerequisite":"None","amalgam":"No","duration":"Passive","poo
